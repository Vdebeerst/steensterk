[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-desktop-connector"
version = "0.0.7"
description = "Windows desktop connector for opening Odoo documents in local applications."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
wa-desktop-connector = "wa_desktop_connector.app:main"

[tool.setuptools.packages.find]
include = ["wa_desktop_connector*"]
