<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="20" ry="20" fill="#ab4be6"/>

  <!-- Inner white rounded square -->
  <rect x="12" y="12" width="104" height="104" rx="14" ry="14" fill="#ffffff"/>

  <!-- API cloud/server shape -->
  <rect x="28" y="38" width="72" height="16" rx="8" ry="8" fill="#ab4be6"/>
  <rect x="28" y="60" width="72" height="16" rx="8" ry="8" fill="#00A09D"/>
  <rect x="28" y="82" width="72" height="16" rx="8" ry="8" fill="#ab4be6" opacity="0.6"/>

  <!-- Connection dots on bars -->
  <circle cx="40" cy="46" r="4" fill="#ffffff"/>
  <circle cx="52" cy="46" r="4" fill="#ffffff"/>

  <circle cx="40" cy="68" r="4" fill="#ffffff"/>
  <circle cx="52" cy="68" r="4" fill="#ffffff"/>

  <circle cx="40" cy="90" r="4" fill="#ffffff"/>
  <circle cx="52" cy="90" r="4" fill="#ffffff"/>

  <!-- Signal/endpoint arrows on right side -->
  <path d="M78 46 L90 46" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M85 42 L90 46 L85 50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M78 68 L90 68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M85 64 L90 68 L85 72" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M78 90 L90 90" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M85 86 L90 90 L85 94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- API text at top -->
  <text x="64" y="30" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="900" fill="#ab4be6" text-anchor="middle" letter-spacing="2">API</text>
</svg>
